name: offline-ci

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify source portability and repository hygiene
        run: python scripts/portability_preflight.py --root . --profile source
      - name: Install uv
        run: python -m pip install "uv>=0.8,<1"
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Sync locked dependencies
        run: uv sync --extra dev --extra browser --frozen
      - name: Verify installed dependency graph
        run: uv pip check
      - name: Compile Python sources
        run: uv run python -m compileall -q src tests scripts
      - name: Unit, integration, E2E, and security tests
        run: uv run pytest -q
      - name: Linux bash and POSIX process-group regression
        if: runner.os == 'Linux'
        run: >-
          uv run pytest -q -rs
          tests/integration/test_shell_cross_platform.py::test_posix_bash_no_profile_utf8_and_lf_smoke
          tests/unit/test_process.py
          tests/unit/test_process_capture.py
      - name: Pull pinned Linux sandbox image
        if: runner.os == 'Linux'
        run: >-
          docker pull
          mirror.gcr.io/library/python@sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a
      - name: Required Linux Docker sandbox regression
        if: runner.os == 'Linux'
        env:
          ASTERCODE_REQUIRE_LIVE_DOCKER: "1"
        run: uv run pytest -q -rs tests/integration/test_docker_process_live.py
      - name: Windows Job Object and PowerShell 7 regression
        if: runner.os == 'Windows'
        run: >-
          uv run pytest -q -rs
          tests/unit/test_windows_job.py
          tests/integration/test_shell_cross_platform.py::test_powershell7_no_profile_and_utf8_smoke
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src tests
      - name: Build wheel and source distribution
        run: uv build
      - name: Locked wheelhouse and offline packaged CLI smoke
        run: uv run python scripts/package_smoke.py
